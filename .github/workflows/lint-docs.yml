name: Vérification de la documentation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Version épinglée : la mettre à jour volontairement, pas à chaque exécution
      - name: Liens internes
        run: npx -y mint@4.2.997 broken-links

      - name: Compilation stricte (MDX, docs.json)
        run: npx -y mint@4.2.997 validate
